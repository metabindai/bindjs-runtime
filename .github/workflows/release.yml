name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        required: true
        default: runtime
        type: choice
        options:
          - runtime
          - react

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # No registry-url here on purpose: actions/setup-node writes an
      # .npmrc with _authToken=${NODE_AUTH_TOKEN}, and any token (even empty)
      # makes npm/pnpm skip OIDC trusted publishing. We want OIDC only.
      # Node 24 ships npm >= 11.5.1, required for the OIDC trusted-publishing
      # handshake. Node 22 ships npm 10, which fails the handshake and the
      # registry treats the publish as anonymous (misleading 404 on PUT).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Publish @metabindai/bindjs-runtime
        if: ${{ inputs.package == 'runtime' }}
        run: |
          set +e
          OUT=$(pnpm --filter @metabindai/bindjs-runtime publish --no-git-checks 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -eq 0 ]; then
            echo "::notice::Published @metabindai/bindjs-runtime"
          elif echo "$OUT" | grep -q "cannot publish over the previously published versions"; then
            echo "::notice::@metabindai/bindjs-runtime version already published - nothing to publish. Bump the version to release."
            exit 0
          else
            echo "::error::Publish failed for @metabindai/bindjs-runtime"
            exit $CODE
          fi

      - name: Publish @metabindai/bindjs-react
        if: ${{ inputs.package == 'react' }}
        run: |
          set +e
          OUT=$(pnpm --filter @metabindai/bindjs-react publish --no-git-checks 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -eq 0 ]; then
            echo "::notice::Published @metabindai/bindjs-react"
          elif echo "$OUT" | grep -q "cannot publish over the previously published versions"; then
            echo "::notice::@metabindai/bindjs-react version already published - nothing to publish. Bump the version to release."
            exit 0
          else
            echo "::error::Publish failed for @metabindai/bindjs-react"
            exit $CODE
          fi
