name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        required: true
        default: both
        type: choice
        options:
          - runtime
          - react
          - both

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # No registry-url here on purpose: actions/setup-node writes an
      # .npmrc with _authToken=${NODE_AUTH_TOKEN}, and any token (even empty)
      # makes npm/pnpm skip OIDC trusted publishing. We want OIDC only.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Publish @metabindai/bindjs-runtime
        if: ${{ inputs.package == 'runtime' || inputs.package == 'both' }}
        run: pnpm --filter @metabindai/bindjs-runtime publish --no-git-checks

      - name: Publish @metabindai/bindjs-react
        if: ${{ inputs.package == 'react' || inputs.package == 'both' }}
        run: pnpm --filter @metabindai/bindjs-react publish --no-git-checks
